backend:
  name: git-gateway
  branch: main
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "posts"
    label: "Blog posts"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post.njk"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", default: "Your Name"}
      - {label: "Category", name: "category", widget: "select", options: ["Book Reviews", "Parenting Reading Tips", "Reading Activities", "Author Stories", "Educational Guides", "Indian Mythology"]}
      - {label: "Tags", name: "tags", widget: "list"}
      - {label: "Short SEO description", name: "description", widget: "markdown"}
      - {label: "Featured image", name: "image", widget: "image"}
      - {label: "Image alt text", name: "imageAlt", widget: "string"}
      - {label: "Article", name: "body", widget: "markdown"}
  - name: "recommendations"
    label: "Book recommendations"
    folder: "src/recommendations"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string"}
      - {label: "Age suitability", name: "age", widget: "string"}
      - {label: "Section", name: "audience", widget: "select", options: ["For Younger Readers", "For Teens", "Indian Mythology", "Beginner Readers", "For Parents"]}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Why recommended", name: "why", widget: "markdown"}
      - {label: "Cover", name: "cover", widget: "image"}
      - {label: "Purchase/review link", name: "link", widget: "string"}
